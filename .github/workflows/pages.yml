name: Publish frontend to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Require deployed API
        env:
          API_URL: ${{ vars.PUBLIC_API_BASE_URL }}
        run: test -n "$API_URL"
      - run: npm ci && npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Support SPA refresh
        run: cp frontend/dist/index.html frontend/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: frontend/dist}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
